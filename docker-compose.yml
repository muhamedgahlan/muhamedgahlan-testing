services:
  fontend:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - server1

  server1:
    build: ./server1
    image: mohamed7444/my-project